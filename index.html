<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>咚咚文件工具箱</title><style>:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#17253c;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e3e8f1;padding:18px max(20px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between}header strong{font-size:22px;color:#265bc6}.pill{background:#eaf1ff;color:#315cb3;padding:8px 12px;border-radius:30px;font-size:12px}main{max-width:1120px;margin:auto;padding:35px 18px}h1{font-size:clamp(28px,5vw,44px);margin:0 0 12px}p{color:#60718a;line-height:1.7}.hero{text-align:center;margin-bottom:32px}.search{width:min(100%,500px);padding:15px 18px;border:1px solid #d4dfef;border-radius:13px;font-size:16px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.tool{background:white;border:1px solid #e2e8f2;border-radius:16px;padding:22px 18px;text-align:left;cursor:pointer;min-height:140px;transition:.2s}.tool:hover{transform:translateY(-3px);box-shadow:0 10px 24px #15335b18;border-color:#8eb0fa}.ico{display:block;font-size:28px;margin-bottom:13px}.tool b{display:block;font-size:16px}.tool small{display:block;margin-top:7px;color:#70819b}.modal{position:fixed;inset:0;background:#0a173d99;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.panel{background:white;border-radius:20px;width:min(100%,650px);padding:25px;max-height:92vh;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{border:0;background:#edf2f9;border-radius:9px;padding:9px 13px;cursor:pointer}.drop{border:2px dashed #a7bce2;border-radius:15px;background:#f8fbff;padding:32px 16px;text-align:center;margin:18px 0;cursor:pointer}.drop.drag{background:#e6efff}.primary{background:#2865d7;color:white;border:0;border-radius:11px;padding:13px 20px;font-size:16px;cursor:pointer}.primary:disabled{opacity:.5;cursor:not-allowed}.files{font-size:14px;word-break:break-word}.note{background:#fff6e6;color:#815e19;padding:12px;border-radius:10px;font-size:13px}.hidden{display:none}footer{text-align:center;padding:30px;color:#78879b;font-size:13px}@media(max-width:850px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.tool{padding:16px 12px;min-height:135px}.tool b{font-size:14px}header{padding:15px}header strong{font-size:18px}.panel{padding:18px}}@media(max-width:360px){.grid{grid-template-columns:1fr}}</style></head><body><header><strong>📁 咚咚文件工具箱</strong><span class="pill">電腦・手機適用</span></header><main><section class="hero"><h1>文件轉換，一站完成</h1><p>Word、Excel、PowerPoint、PDF 轉換與整理工具。<br>選擇工具，上傳檔案，輕鬆處理。</p><input id="search" class="search" placeholder="🔍 搜尋工具，例如 PDF 合併、Excel..." aria-label="搜尋工具"></section><div id="grid" class="grid"></div></main><footer>咚咚文件工具箱 · 完整網站版 · 文件上傳後於伺服器暫存處理並刪除</footer><div id="modal" class="modal" role="dialog" aria-modal="true"><div class="panel"><div class="top"><h2 id="title"></h2><button class="close" id="close">✕ 關閉</button></div><p id="desc"></p><div class="drop" id="drop">📤<br><b>點選選擇檔案，或拖曳至此</b><p id="acceptLabel"></p><input type="file" id="file" class="hidden"></div><div id="fileList" class="files"></div><div id="options"></div><p class="note" id="notice"></p><button id="run" class="primary" disabled>開始處理</button><p id="status" aria-live="polite"></p></div></div><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
const specs=[['Word 轉 PDF','word','📘'],['Word 轉 JPG','word','🖼️'],['Excel 轉 PDF','excel','📗'],['Excel 轉 JPG','excel','🖼️'],['Excel 工作表分開儲存 PDF','excel','📑'],['Excel 拆分工作表','excel','✂️'],['PowerPoint 轉 PDF','ppt','📙'],['PDF 轉 PowerPoint','pdf','📽️'],['PDF 合併','pdf','🔗'],['PDF 解鎖','pdf','🔓'],['PDF 旋轉','pdf','🔄'],['PDF 拆分','pdf','✂️'],['PDF 轉 Word','pdf','📝'],['PDF 轉 Excel','pdf','📊'],['PDF 轉 JPG','pdf','🖼️'],['PDF 轉 PNG','pdf','🏞️'],['刪除 PDF 頁面','pdf','🗑️'],['壓平 PDF','pdf','📄'],['修復和還原 PDF','pdf','🛠️']];
const available=new Set(specs.map((_,i)=>i));let current=-1,selected=[];const $=id=>document.getElementById(id);const grid=$('grid');function render(q=''){grid.innerHTML='';specs.forEach(([name,type,ico],i)=>{if(!name.toLowerCase().includes(q.toLowerCase()))return;const b=document.createElement('button');b.className='tool';b.innerHTML=`<span class="ico">${ico}</span><b>${name}</b><small>${'✓ 可使用'}</small>`;b.onclick=()=>openTool(i);grid.append(b)})}render();$('search').oninput=e=>render(e.target.value);
function openTool(i){current=i;selected=[];const [name,type]=specs[i];$('title').textContent=name;$('desc').textContent='透過本網站伺服器處理文件，完成後立即下載。';$('file').accept=type==='pdf'?'.pdf':type==='word'?'.doc,.docx':type==='excel'?'.xls,.xlsx':'.ppt,.pptx';$('file').multiple=i===8;$('acceptLabel').textContent='支援 '+$('file').accept+' 格式'+(i===8?'，可選多個檔案':'');$('file').value='';$('fileList').textContent='';$('options').innerHTML='';$('status').textContent='';$('notice').textContent='檔案將上傳到目前部署的伺服器進行轉換；單檔上限 40 MB。掃描文件與複雜排版可能無法完整還原。';$('run').disabled=true;$('modal').classList.add('show');if(type==='pdf' && i!==8)$('options').innerHTML='<label>PDF 密碼（若有）：<input id="password" type="password" autocomplete="off" placeholder="請輸入已知密碼" style="padding:10px;margin:10px"></label><br>';if(i===13)$('options').innerHTML+='<label>轉換模式：<select id="excelMode"><option value="table">智慧表格（可編輯，盡量還原位置）</option><option value="precision">精準表格（依表格線重建，可編輯）</option><option value="visual">原始版面（圖片，外觀精準但不可編輯）</option></select></label><p>PDF 不包含原始 Excel 儲存格資料；複雜表格及掃描檔無法保證還原。</p>';if(i===10)$('options').innerHTML+='<label>旋轉角度：<select id="angle"><option value="90">順時針 90°</option><option value="180">180°</option><option value="270">順時針 270°</option></select></label>';if(i===11)$('options').innerHTML+='<label>保留頁碼（例：1-3,5）：<input id="pages" placeholder="1-3,5" style="padding:10px;width:170px"></label><p>每個選取的頁面將分別輸出為 PDF，並打包 ZIP。</p>';if(i===16)$('options').innerHTML+='<label>刪除頁碼（例：2,4-6）：<input id="pages" placeholder="2,4-6" style="padding:10px;width:170px"></label>'}
$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};$('drop').onclick=()=>$('file').click();$('file').onchange=e=>choose(e.target.files);$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('drag')};$('drop').ondragleave=()=>$('drop').classList.remove('drag');$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('drag');choose(e.dataTransfer.files)};function choose(files){selected=[...files];$('fileList').textContent=selected.map(f=>`${f.name} (${(f.size/1024/1024).toFixed(2)} MB)`).join('、');$('run').disabled=!selected.length||!available.has(current)}
function parsePages(raw,n){const out=new Set();for(const part of raw.split(',')){const m=part.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/);if(!m)throw Error('頁碼格式不正確');const a=+m[1],b=m[2]?+m[2]:a;if(a<1||b>n||a>b)throw Error(`頁碼需介於 1 到 ${n}`);for(let k=a;k<=b;k++)out.add(k-1)}return [...out].sort((a,b)=>a-b)}function save(bytes,name,type='application/pdf'){const blob=new Blob([bytes],{type});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),60000)}
$('run').onclick=async()=>{if(!selected.length)return;$('run').disabled=true;$('status').textContent='正在處理，請稍候…';try{const data=new FormData();data.append('tool',current);data.append('option',$('excelMode')?.value||$('pages')?.value||$('angle')?.value||'');data.append('password',$('password')?.value||'');selected.forEach(f=>data.append('files',f));const response=await fetch('/api/process',{method:'POST',body:data});if(!response.ok){let msg='伺服器處理失敗';try{const error=await response.json();msg=error.detail||msg}catch{}throw Error(msg)}const blob=await response.blob();const disposition=response.headers.get('X-Filename');const name=disposition?decodeURIComponent(disposition):'處理結果';const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);$('status').textContent='✓ 處理完成，已開始下載。'}catch(e){$('status').textContent='無法處理：'+e.message}finally{$('run').disabled=false}};
</script></body></html>
